name: Keep Backend Alive

on:
  schedule:
    # 每 10 分钟运行一次 (GitHub Actions cron 最小间隔是 5 分钟)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend to keep it alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://stock-advisor-api-6vtb.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "Backend is healthy!"
          else
            echo "Backend returned: $response"
          fi

      - name: Ping API Endpoint
        run: |
          echo "Pinging API endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://stock-advisor-api-6vtb.onrender.com/api/v1/market/overview)
          echo "Market API response: $response"
