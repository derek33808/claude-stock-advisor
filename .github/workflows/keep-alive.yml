name: Keep Backend Alive

on:
  schedule:
    # 每10分钟运行一次 (Render 免费版15分钟后休眠)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend to keep it alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://stock-advisor-api-6vtb.onrender.com/health)
          if [ "$response" = "200" ]; then
            echo "Backend is alive! Status: $response"
          else
            echo "Backend returned status: $response (might be waking up)"
          fi

      - name: Ping API Endpoint
        run: |
          echo "Pinging API to warm up cache..."
          curl -s --max-time 30 "https://stock-advisor-api-6vtb.onrender.com/api/v1/market/overview" || echo "Market overview request completed"
